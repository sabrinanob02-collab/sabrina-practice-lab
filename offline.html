<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Law School Practice Lab Offline</title>
  <meta name="theme-color" content="#6d3f29">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #17212b;
      background: #f7f9fb;
    }

    main {
      max-width: 520px;
      padding: 24px;
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(20, 39, 58, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: #4f5f6f;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Law School Practice Lab</h1>
    <p>The app is offline-ready after its first full load. Reconnect once, open the drill app, and it will cache the verified practice bank for later use.</p>
  </main>
</body>
</html>
